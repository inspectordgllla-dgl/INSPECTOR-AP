<script>
function toggleActualFields() {
  var visit = document.getElementById('has_visit').checked;
  var survey = document.getElementById('has_survey').checked;
  var officeEl = document.getElementById('has_office');
  var office = officeEl ? officeEl.checked : false;
  var leaveEl = document.getElementById('has_leave');
  var leave = leaveEl ? leaveEl.checked : false;

  var visitGroup = document.getElementById('visit_group');
  var surveyGroup = document.getElementById('survey_group');
  var leaveGroup = document.getElementById('leave_group');
  if (visitGroup) visitGroup.classList.toggle('active', visit);
  if (surveyGroup) surveyGroup.classList.toggle('active', survey);
  if (leaveGroup) leaveGroup.classList.toggle('active', leave);

  var surveyYearSel = document.getElementById('survey_year_select');
  if (surveyYearSel) surveyYearSel.required = survey;

  var leaveTypeSel = document.getElementById('leave_type_select');
  if (leaveTypeSel) leaveTypeSel.required = leave;

  // அன்று விடுப்பு மட்டும் என்றால் ("பார்வை/ஆய்வு/அலுவலகப் பணி" இல்லாமல்)
  // "எடுத்துக் கொண்ட நேரம்" கட்டாயமில்லை.
  var onlyLeave = leave && !(visit || survey || office);
  var timeFromSel = document.getElementById('time_from_select');
  var timeToSel = document.getElementById('time_to_select');
  if (timeFromSel) timeFromSel.required = !onlyLeave;
  if (timeToSel) timeToSel.required = !onlyLeave;
}

function setupChecklist(containerId, countId) {
  var container = document.getElementById(containerId);
  if (!container) return;
  var max = parseInt(container.dataset.max, 10);
  var boxes = container.querySelectorAll('input[type=checkbox]');
  var countEl = document.getElementById(countId);
  function update() {
    var checked = container.querySelectorAll('input[type=checkbox]:checked').length;
    if (countEl) countEl.textContent = checked + ' / ' + max + ' தேர்வு செய்யப்பட்டது';
    boxes.forEach(function (b) {
      if (!b.checked) { b.disabled = checked >= max; }
    });
  }
  boxes.forEach(function (b) { b.addEventListener('change', update); });
  update();
}

document.querySelectorAll('.lib-filter').forEach(function (inp) {
  inp.addEventListener('input', function () {
    var target = document.getElementById(this.dataset.target);
    var q = this.value.trim();
    target.querySelectorAll('label').forEach(function (lbl) {
      lbl.style.display = lbl.textContent.indexOf(q) !== -1 ? '' : 'none';
    });
  });
});

toggleActualFields();
setupChecklist('visit_checklist', 'visit_count');
setupChecklist('survey_checklist', 'survey_count');
</script>
