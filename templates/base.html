<!DOCTYPE html>
<html lang="ta">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}நூலக ஆய்வாளர் - பயணத் திட்டம்{% endblock %}</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Tamil:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  body {
    font-family: 'Noto Sans Tamil', sans-serif;
    background: #f4f6f8;
    margin: 0;
    padding: 0;
    color: #1f2933;
  }
  header.topbar {
    background: #14532d;
    color: #fff;
    padding: 16px 20px;
  }
  header.topbar h1 { margin: 0; font-size: 1.2rem; }
  header.topbar a { color: #d1fae5; text-decoration: none; font-size: 0.9rem; }
  main {
    max-width: 900px;
    margin: 20px auto;
    padding: 0 16px 40px;
  }
  .card {
    background: #fff;
    border-radius: 10px;
    box-shadow: 0 1px 4px rgba(0,0,0,0.08);
    padding: 20px;
    margin-bottom: 20px;
  }
  .dash-btn {
    display: block;
    width: 100%;
    text-align: center;
    padding: 22px 16px;
    margin-bottom: 16px;
    border-radius: 10px;
    text-decoration: none;
    font-size: 1.1rem;
    font-weight: 600;
    color: #fff;
    box-shadow: 0 2px 6px rgba(0,0,0,0.12);
  }
  .dash-btn.plan1 { background: #2563eb; }
  .dash-btn.plan2 { background: #7c3aed; }
  .dash-btn.plan3 { background: #ea580c; }
  .dash-btn:hover { filter: brightness(1.08); }

  label { display:block; margin: 10px 0 4px; font-weight:600; }
  select, input[type=text] {
    width: 100%;
    padding: 10px;
    font-size: 1rem;
    border-radius: 6px;
    border: 1px solid #cbd5e1;
    font-family: inherit;
  }
  button, .btn {
    background: #14532d;
    color: #fff;
    border: none;
    padding: 12px 20px;
    border-radius: 6px;
    font-size: 1rem;
    cursor: pointer;
    text-decoration: none;
    display: inline-block;
    margin-top: 14px;
    font-family: inherit;
  }
  button:hover, .btn:hover { filter: brightness(1.1); }
  .btn-secondary { background: #64748b; }

  table { width: 100%; border-collapse: collapse; margin-top: 10px; }
  th, td { border: 1px solid #e2e8f0; padding: 8px; text-align: left; font-size: 0.92rem; }
  th { background: #f1f5f9; }
  tr.holiday td { background: #fee2e2; }
  tr.weekly-off td { background: #fef9c3; }
  tr.second-saturday td { background: #ffedd5; }
  tr.pending-row td { background: #dbeafe; }

  .flash { background:#fef3c7; border:1px solid #f59e0b; padding:10px 14px; border-radius:6px; margin-bottom:14px; }
  .progress-note { color:#475569; font-size:0.9rem; margin-top:6px; }
  .field-group { display:none; }
  .field-group.active { display:block; }

  .check-row { display:flex; gap:18px; flex-wrap:wrap; margin:10px 0; }
  .check-row label { display:flex; align-items:center; gap:6px; font-weight:600; margin:0; }
  .check-row input[type=checkbox] { width:18px; height:18px; }

  .lib-filter { width:100%; padding:8px; margin:8px 0 6px; border-radius:6px; border:1px solid #cbd5e1; font-family:inherit; font-size:0.9rem; }
  .lib-checklist { max-height:220px; overflow-y:auto; border:1px solid #cbd5e1; border-radius:6px; padding:8px 10px; background:#fff; }
  .lib-checklist label { display:block; font-weight:400; margin:4px 0; font-size:0.92rem; }
  .lib-checklist input[type=checkbox] { margin-right:6px; }
  .lib-checklist input[type=checkbox]:disabled + span { color:#9ca3af; }
  .lib-count { font-size:0.85rem; color:#475569; margin:4px 0 0; }

  .time-row { display:flex; gap:14px; flex-wrap:wrap; }
  .time-row .time-field { flex:1; min-width:140px; }

  td.content-cell { line-height:1.5; }

  /* ---- Chatbot UI ---- */
  .chat-wrap { display:flex; flex-direction:column; gap:10px; margin:14px 0; max-height:520px; overflow-y:auto; padding:4px 2px; }
  .chat-bubble { max-width:82%; padding:10px 14px; border-radius:14px; font-size:0.95rem; line-height:1.45; margin:0; }
  .chat-bot { align-self:flex-start; background:#eef2f7; color:#1f2933; border-bottom-left-radius:4px; }
  .chat-user { align-self:flex-end; background:#14532d; color:#fff; border-bottom-right-radius:4px; }
  .chat-options { display:flex; flex-wrap:wrap; gap:8px; align-self:flex-start; max-width:92%; }
  .chip { padding:8px 14px; border-radius:20px; border:1.5px solid #14532d; background:#fff; color:#14532d; cursor:pointer; font-size:0.9rem; font-family:inherit; margin:0; }
  .chip:hover { background:#e6f4ea; }
  .chip.selected { background:#14532d; color:#fff; }
  .chip:disabled { opacity:0.4; cursor:not-allowed; }
  .chat-continue-btn { background:#2563eb; border-color:#2563eb; color:#fff; font-weight:600; }
  .chat-continue-btn:disabled { background:#94a3b8; border-color:#94a3b8; }
  .chat-search-box { display:flex; flex-direction:column; align-items:stretch; gap:6px; width:100%; max-width:420px; }
  .chat-search { padding:9px 10px; border-radius:8px; border:1px solid #cbd5e1; font-family:inherit; font-size:0.9rem; margin:0; }
  .chat-chip-list { display:flex; flex-wrap:wrap; gap:8px; max-height:220px; overflow-y:auto; padding:4px; border:1px solid #e2e8f0; border-radius:8px; background:#fff; }
</style>
</head>
<body>
<header class="topbar">
  <h1>நூலக ஆய்வாளர் -  பயணத் திட்டம்</h1>
  <a href="{{ url_for('dashboard') }}">&larr; முதன்மைப் பக்கம்</a>
</header>
<main>
  {% with messages = get_flashed_messages() %}
    {% if messages %}
      {% for m in messages %}
        <div class="flash">{{ m }}</div>
      {% endfor %}
    {% endif %}
  {% endwith %}
  {% block content %}{% endblock %}
</main>
</body>
</html>
