{% extends "base.html" %}
{% block content %}
<div class="card">
  <h2>{{ month_name }} - {{ year }} — நாள் பதிவைத் திருத்து</h2>
  <h3>{{ day.day_date.strftime('%d-%m-%Y') }} ({{ day.weekday }})</h3>

  <div class="chat-wrap" id="chatWrap"></div>
  <form method="post" action="{{ url_for('planned_edit_day_save', year=year, month=month, day_id=day.id) }}" id="dayForm" style="display:none;">
    <input type="hidden" name="work_type" id="work_type_input">
    <input type="hidden" name="library_name" id="library_name_input">
    <input type="hidden" name="survey_year" id="survey_year_input">
    <input type="hidden" name="leave_type" id="leave_type_input">
  </form>
  <a class="btn btn-secondary" href="{{ url_for('planned_view', year=year, month=month) }}">ரத்து செய்</a>
</div>

<script src="{{ url_for('static', filename='chat.js') }}"></script>
<script>
(function () {
  var workTypes = {{ work_types | tojson }};
  var libraries = {{ libraries | tojson }};
  var surveyYears = {{ survey_years | tojson }};
  var leaveTypes = {{ leave_types | tojson }};
  var dateLabel = "{{ day.day_date.strftime('%d-%m-%Y') }} ({{ day.weekday }})";

  var wrap = document.getElementById('chatWrap');
  var form = document.getElementById('dayForm');
  var libraryItems = libraries.map(function (l) {
    return { label: l.name + (l.type ? ' (' + l.type + ')' : ''), value: l.name };
  });

  var currentDisplay = {{ day.place_display | tojson }};

  function askWorkType() {
    chatBot(wrap, dateLabel + " அன்று என்ன பணி? (தற்போதைய பதிவு: " + currentDisplay + ")");
    chatChips(wrap, workTypes.map(function (wt) { return { label: wt, value: wt }; }), function (choice) {
      chatUser(wrap, choice.label);
      document.getElementById('work_type_input').value = choice.value;
      if (choice.value === 'நூலகங்கள் ஆய்வு') {
        askLibrary();
      } else if (choice.value === 'விடுப்பு') {
        askLeaveType();
      } else {
        confirmSave();
      }
    });
  }

  function askLibrary() {
    chatBot(wrap, "எந்த நூலகம்?");
    chatSearchChips(wrap, libraryItems, 1, 'தேர்வு முடிந்தது', function (selected) {
      var pick = selected[0];
      chatUser(wrap, pick.label);
      document.getElementById('library_name_input').value = pick.value;
      askSurveyYear();
    });
  }

  function askSurveyYear() {
    chatBot(wrap, "ஆய்வு ஆண்டு?");
    chatChips(wrap, surveyYears.map(function (sy) { return { label: sy, value: sy }; }), function (choice) {
      chatUser(wrap, choice.label);
      document.getElementById('survey_year_input').value = choice.value;
      confirmSave();
    });
  }

  function askLeaveType() {
    chatBot(wrap, "விடுப்பு வகை?");
    chatChips(wrap, leaveTypes.map(function (lt) { return { label: lt, value: lt }; }), function (choice) {
      chatUser(wrap, choice.label);
      document.getElementById('leave_type_input').value = choice.value;
      confirmSave();
    });
  }

  function confirmSave() {
    chatBot(wrap, "சரி, இந்த திருத்தத்தைச் சேமிக்கலாமா?");
    chatChips(wrap, [{ label: '✅ சேமி', value: 'save' }, { label: '🔄 மீண்டும்', value: 'restart' }], function (choice) {
      chatUser(wrap, choice.label);
      if (choice.value === 'save') {
        form.submit();
      } else {
        wrap.innerHTML = '';
        document.getElementById('work_type_input').value = '';
        document.getElementById('library_name_input').value = '';
        document.getElementById('survey_year_input').value = '';
        document.getElementById('leave_type_input').value = '';
        askWorkType();
      }
    });
  }

  askWorkType();
})();
</script>
{% endblock %}
