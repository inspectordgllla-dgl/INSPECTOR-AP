{% extends "base.html" %}
{% block content %}
<div class="card">
  <h2>{{ month_name }} - {{ year }} — நாள் பதிவைத் திருத்து</h2>
  <h3>{{ day.day_date.strftime('%d-%m-%Y') }} ({{ day.weekday }})</h3>

  <form method="post" action="{{ url_for('planned_edit_day_save', year=year, month=month, day_id=day.id) }}">
    <label>பணியிடம்</label>
    <select name="work_type" id="work_type" onchange="toggleFields()" required>
      <option value="">-- தேர்வு செய்யவும் --</option>
      {% for wt in work_types %}
        <option value="{{ wt }}" {% if wt == day.work_type %}selected{% endif %}>{{ wt }}</option>
      {% endfor %}
    </select>

    <div class="field-group" id="library_group">
      <label>நூலகம் பெயர்</label>
      <select name="library_name">
        <option value="">-- நூலகம் தேர்வு செய்யவும் --</option>
        {% for lib in libraries %}
          <option value="{{ lib.name }}" {% if lib.name == day.library_name %}selected{% endif %}>{{ lib.name }}{% if lib.type %} ({{ lib.type }}){% endif %}</option>
        {% endfor %}
      </select>

      <label>ஆய்வு ஆண்டு</label>
      <select name="survey_year">
        <option value="">-- ஆண்டு தேர்வு செய்யவும் --</option>
        {% for sy in survey_years %}
          <option value="{{ sy }}" {% if sy == day.survey_year %}selected{% endif %}>{{ sy }}</option>
        {% endfor %}
      </select>
    </div>

    <div class="field-group" id="leave_group">
      <label>விடுப்பு வகை</label>
      <select name="leave_type">
        <option value="">-- விடுப்பு வகை தேர்வு செய்யவும் --</option>
        {% for lt in leave_types %}
          <option value="{{ lt }}" {% if lt == day.leave_type %}selected{% endif %}>{{ lt }}</option>
        {% endfor %}
      </select>
    </div>

    <button type="submit">மாற்றங்களைச் சேமி</button>
    <a class="btn btn-secondary" href="{{ url_for('planned_view', year=year, month=month) }}">ரத்து செய்</a>
  </form>
</div>

<script>
function toggleFields() {
  var wt = document.getElementById('work_type').value;
  var libGroup = document.getElementById('library_group');
  var librarySelect = libGroup.querySelector('select[name=library_name]');
  var surveySelect = libGroup.querySelector('select[name=survey_year]');
  if (wt === 'நூலகங்கள் ஆய்வு') {
    libGroup.classList.add('active');
    librarySelect.required = true;
    surveySelect.required = true;
  } else {
    libGroup.classList.remove('active');
    librarySelect.required = false;
    surveySelect.required = false;
  }

  var leaveGroup = document.getElementById('leave_group');
  var leaveSelect = leaveGroup.querySelector('select[name=leave_type]');
  if (wt === 'விடுப்பு') {
    leaveGroup.classList.add('active');
    leaveSelect.required = true;
  } else {
    leaveGroup.classList.remove('active');
    leaveSelect.required = false;
  }
}
toggleFields();
</script>
{% endblock %}
